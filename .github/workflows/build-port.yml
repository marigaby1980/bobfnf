          EOF
          
          [span_36](start_span)if [ -f "Project.xml" ]; then[span_36](end_span)
            [span_37](start_span)sed -i -e '/discord_rpc/d' -e '/discord-rpc/d' -e '/linc_luajit/d' Project.xml || true[span_37](end_span)
          fi
          
          find source -name "*.hx" -type f -exec sed -i \
            -e 's/sys\.FileSystem/FileSystem/g' \
