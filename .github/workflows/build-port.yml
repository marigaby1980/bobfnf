name: Build FNF Web Port

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct URL to your mod .zip file (Google Drive, Dropbox, MediaFire, Discord, etc.)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install System Font Generators
        run: |
          sudo apt-get update && sudo apt-get install -y fontforge woff-tools woff2 zip unzip perl sfnt2woff-zopfli || true
          for tool in sfnt2woff woff2_compress woff-code-page woff-font-converter; do sudo bash -c "echo -e '#!/bin/bash\nexit 0' > /usr/local/bin/\$tool"; sudo chmod +x /usr/local/bin/\$tool; done

      - name: Checkout Base Engine
        uses: actions/checkout@v4
        with:
          repository: 'ShadowMario/FNF-PsychEngine'
          path: 'engine-source'

      - name: Download Mod Payload
        run: |
          echo "Downloading mod from URL provided..."
          pip install gdown --quiet
          
          URL="${{ github.event.inputs.mod_url }}"
          
          if [[ "$URL" == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod-payload.zip
          else
            wget -q -O mod-payload.zip "$URL"
          fi
          
          echo "Extracting Mod Payload..."
          mkdir -p mods_upload
          unzip -q mod-payload.zip -d mods_upload/
          rm mod-payload.zip

      - name: Inject Mods into Engine
        run: |
          cd engine-source
          mkdir -p mods assets
          cp -rn ../mods_upload/* mods/ || true
          cp -rn ../mods_upload/* assets/ || true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxelibs and Dependencies
        run: |
          cd engine-source
          haxelib setup ~/haxelib
          haxelib install hmm --quiet || true
          haxelib run hmm install --quiet || true
          haxelib install lime 8.0.1 --quiet || haxelib install lime --quiet
          haxelib install openfl 9.3.3 --quiet || haxelib install openfl --quiet
          haxelib install flixel 5.6.1 --quiet || haxelib install flixel --quiet
          haxelib install flixel-addons 3.2.2 --quiet || haxelib install flixel-addons --quiet
          haxelib install flixel-ui 2.5.0 --quiet || haxelib install flixel-ui --quiet
          haxelib install tjson 1.4.0 --quiet || haxelib install tjson --quiet
          haxelib install flxanimate 3.0.4 --quiet || haxelib install flxanimate --quiet
          haxelib install hscript --quiet || true
          haxelib run lime setup --quiet || true
          haxelib run lime setup flixel --quiet || true

      - name: Patch HTML5 incompatible code (Mock Sys)
        run: |
          cd engine-source
          echo 'class FileSystem { public static function absolutePath(path:String) return path; public static function exists(path:String) return false; public static function readDirectory(path:String):Array<String> return []; public static function isDirectory(path:String) return false; public static function stat(path:String) return null; public static function fullPath(path:String) return path; public static function createDirectory(path:String) {} public static function deleteFile(path:String) {} public static function deleteDirectory(path:String) {} }' > source/FileSystem.hx
          echo 'class File { public static function getContent(path:String) return ""; public static function getBytes(path:String) return null; public static function saveContent(path:String, c:String) return; public static function saveBytes(path:String, b:Dynamic) return; public static function copy(s:String, d:String) {} }' > source/File.hx
          echo 'class Sys { public static function exit(code:Int) {} public static function sleep(t:Float) {} public static function command(c:String, ?a:Array<String>) return 0; public static function args():Array<String> return []; public static function getCwd() return ""; public static function setCwd(s:String) {} public static function print(v:Dynamic) {} public static function println(v:Dynamic) {} public static function environment() return new haxe.ds.StringMap<String>(); public static function getEnv(s:String) return ""; public static function programPath() return ""; public static function systemName() return "HTML5"; public static function time() return Date.now().getTime() / 1000; }' > source/Sys.hx
          echo 'class Process { public var stdout:Dynamic; public var stderr:Dynamic; public function new(c:String, ?a:Dynamic) { stdout = { readAll: function() return { toString: function() return "" }, readLine: function() return "" }; stderr = stdout; } public function exitCode(b:Bool=true) return 0; public function close() {} }' > source/Process.hx
          echo 'class Thread { public static function create(f:Void->Void) { f(); } public static function readMessage(b:Bool) return null; public static function sendMessage(m:Dynamic) {} public static function current() return new Thread(); }' > source/Thread.hx
          echo 'class Mutex { public function new() {} public function acquire() {} public function release() {} }' > source/Mutex.hx
          echo 'class FixedThreadPool { public var tasksCount(default, null):Int = 0; public function new(n:Int) {} public function run(f:Void->Void) { tasksCount++; try { f(); } catch(e:Dynamic) {} tasksCount--; } public function shutdown() {} }' > source/FixedThreadPool.hx
          echo 'class ElasticThreadPool { public function new(m:Int, t:Float) {} public function run(f:Void->Void) { try { f(); } catch(e:Dynamic) {} } public function shutdown() {} }' > source/ElasticThreadPool.hx
          echo 'class Deque<T> { var q:Array<T> = []; public function new() {} public function add(i:T) q.push(i); public function push(i:T) q.unshift(i); public function pop(b:Bool):T return q.shift(); }' > source/Deque.hx
          
          sed -i -e '/discord_rpc/d' -e '/discord-rpc/d' -e '/linc_luajit/d' -e '/faxe/d' -e '/hxCodec/d' Project.xml || true
          mkdir -p source/hxdiscord_rpc source/backend
          
          echo 'package hxdiscord_rpc; class Discord { public static function Initialize(a:String,b:Bool,c:Dynamic){} public static function Shutdown(){} public static function RunCallbacks(){} public static function UpdatePresence(a:Dynamic){} public static function ClearPresence(){} }' > source/hxdiscord_rpc/Discord.hx
          echo 'package hxdiscord_rpc; class Types { public static inline var DISCORD_REPLY_NO=0; public static inline var DISCORD_REPLY_YES=1; public static inline var DISCORD_REPLY_IGNORE=2; }' > source/hxdiscord_rpc/Types.hx
          echo 'package hxdiscord_rpc; typedef DiscordPresence = Dynamic; typedef DiscordRichPresence = Dynamic;' > source/hxdiscord_rpc/DiscordPresence.hx
          echo 'package backend; typedef DiscordRichPresence = Dynamic; class DiscordClient { public static var isInitialized:Bool = false; public function new() {} public static function check() {} public static function prepare() {} public static function changePresence(?a:String, ?b:String, ?c:String, ?d:Bool, ?e:Float) {} public static function resetClientID() {} public static function initialize() {} public static function shutdown() {} public static function addLuaCallbacks(l:Dynamic) {} public static function loadDiscordRPC() {} }' > source/backend/Discord.hx
          cp source/backend/Discord.hx source/Discord.hx 2>/dev/null || true

          find source -name "*.hx" -type f -exec sed -i -e 's/sys\.FileSystem/FileSystem/g' -e 's/sys\.io\.File/File/g' -e 's/sys\.io\.Process/Process/g' -e 's/sys\.thread\.Thread/Thread/g' -e 's/sys\.thread\.Mutex/Mutex/g' -e 's/sys\.thread\.FixedThreadPool/FixedThreadPool/g' -e 's/sys\.thread\.ElasticThreadPool/ElasticThreadPool/g' -e 's/sys\.thread\.Deque/Deque/g' -e '/import cpp/d' -e '/import llua/d' {} +
          find source -name "import.hx" -type f -exec sed -i 's/import sys\.thread\./\/\/ import sys.thread./g' {} +
          find . -name "FlxSoundTray.hx" -type f -exec sed -i 's/public function new(/public function showIncrement() { show(); } public function showDecrement() { show(); }\n\n&/g' {} +

      - name: Optimization & Web Compile Build
        run: |
          cd engine-source
          haxelib run lime build html5 -release -D DISCORD_DISABLE -D LUA_DISABLED -D VIDMOD_ENABLED=false -D NO_PRELOAD_ALL -D suppress-warnings

      - name: Bundle into Standalone Offline HTML File
        run: |
          cd engine-source/export/release/html5/bin
          
          node -e "
          const fs = require('fs');
          const path = require('path');
          const mime = { '.png':'image/png', '.jpg':'image/jpeg', '.gif':'image/gif', '.ogg':'audio/ogg', '.mp3':'audio/mpeg', '.wav':'audio/wav', '.json':'application/json', '.xml':'text/xml', '.txt':'text/plain', '.ttf':'font/ttf', '.woff':'font/woff', '.woff2':'font/woff2' };
          function getFiles(dir, list = []) { fs.readdirSync(dir).forEach(f => { let p = path.join(dir, f); fs.statSync(p).isDirectory() ? getFiles(p, list) : list.push(p); }); return list; }
          let base = process.cwd();
          let vfs = {}, js = [];
          getFiles(base).forEach(f => {
            let rel = path.relative(base, f).replace(/\\\\/g, '/');
            if (rel === 'index.html' || rel === 'standalone.html') return;
            if (rel.endsWith('.js')) js.push(fs.readFileSync(f, 'utf8'));
            else vfs[rel] = 'data:' + (mime[path.extname(f).toLowerCase()] || 'application/octet-stream') + ';base64,' + fs.readFileSync(f).toString('base64');
          });
          let html = '<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>FNF Offline Port</title><style>body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}#openfl-content{width:100%;height:100%}</style><script>window.__VFS__=' + JSON.stringify(vfs) + ';(function(){let oO=XMLHttpRequest.prototype.open,oS=XMLHttpRequest.prototype.send;XMLHttpRequest.prototype.open=function(m,u){this._u=u.replace(/^[./]+/, \"\");return oO.apply(this,arguments);};XMLHttpRequest.prototype.send=function(d){let k=Object.keys(window.__VFS__).find(x=>this._u&&(this._u.endsWith(x)||x.endsWith(this._u)));if(k&&window.__VFS__[k]){let uri=window.__VFS__[k];Object.defineProperty(this,\"responseURL\",{value:uri});if(uri.startsWith(\"data:application/json\")||uri.startsWith(\"data:text/\")){let dec=atob(uri.split(\",\")[1]);Object.defineProperty(this,\"responseText\",{value:dec});Object.defineProperty(this,\"response\",{value:dec});}setTimeout(()=>{Object.defineProperty(this,\"status\",{value:200});Object.defineProperty(this,\"readyState\",{value:4});if(this.onreadystatechange)this.onreadystatechange();if(this.onload)this.onload();},1);return;}return oS.apply(this,arguments);};})();let oI=window.Image;window.Image=function(){let i=new oI(),s=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,\"src\").set;Object.defineProperty(i,\"src\",{set:function(u){let k=Object.keys(window.__VFS__).find(x=>u&&(u.endsWith(x)||x.endsWith(u)));s.call(this,k&&window.__VFS__[k]?window.__VFS__[k]:u);}});return i;};</script></head><body><div id=\"openfl-content\"></div><script>' + js.join('\n;\n') + '</script></body></html>';
          fs.writeFileSync('standalone.html', html);
          "
          
          cp standalone.html index.html
          zip -r ../../../../../web_export.zip *

      - name: Upload Single Offline HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-offline-game
          path: engine-source/export/release/html5/bin/standalone.html

      - name: Auto-Publish to GitHub Branch
        run: |
          cd engine-source/export/release/html5/bin
          mkdir -p deploy
          cp standalone.html deploy/index.html
          cd deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automated Single-File Offline Web Port"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:web-build

