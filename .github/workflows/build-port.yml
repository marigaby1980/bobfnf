            -e 's/sys\.Sys/Sys/g' \
            -e 's/sys\.Thread/Thread/g' \
            -e 's/sys\.thread\.Mutex/Mutex/g' \
            -e 's/sys\.thread\.FixedThreadPool/FixedThreadPool/g' \
            [span_38](start_span){} + || true[span_38](end_span)
          
          [span_39](start_span)echo "HTML5 patching completed"[span_39](end_span)

      - [span_40](start_span)name: Optimization & Web Compile Build[span_40](end_span)
        run: |
          set -e
          cd engine-source
          [span_41](start_span)haxelib run lime build html5 -release -D DISCORD_DISABLE -D NO_PRELOAD_ALL -D NO_COMPILATION_TRACE[span_41](end_span)

      - [span_42](start_span)name: Package Flat ZIP & Standardize output[span_42](end_span)
        run: |
          [span_43](start_span)set -e[span_43](end_span)
          BUILD_DIR="engine-source/export/release/html5/bin"
          [span_44](start_span)cd "$BUILD_DIR"[span_44](end_span)
          [span_45](start_span)MAIN_JS=$(ls *.js 2>/dev/null | grep -E -v 'howler|pako' | head -n 1)[span_45](end_span)
          [span_46](start_span)if [ -n "$MAIN_JS" ] && [ "$MAIN_JS" != "funkin.js" ]; then[span_46](end_span)
