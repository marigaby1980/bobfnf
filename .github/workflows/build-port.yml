name: Build FNF Web Port

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct URL to your mod .zip file (Google Drive, Dropbox, MediaFire, Discord, etc.)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Base Engine
        uses: actions/checkout@v4
        with:
          repository: 'ShadowMario/FNF-PsychEngine'
          path: 'engine-source'

      - name: Download Mod Payload
        run: |
          set -e
          echo "Downloading mod from URL provided..."
          pip install gdown --quiet
          
          URL="${{ github.event.inputs.mod_url }}"
          
          if [[ "$URL" == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod-payload.zip || { echo "Failed to download from Google Drive"; exit 1; }
          else
            wget -q -O mod-payload.zip "$URL" || { echo "Failed to download from URL"; exit 1; }
          fi
          
          echo "Extracting Mod Payload..."
          mkdir -p mods_upload
          unzip -q mod-payload.zip -d mods_upload/ || { echo "Failed to extract ZIP"; exit 1; }
          rm mod-payload.zip
          echo "Mod payload extracted successfully"

      - name: Inject Mods into Engine
        run: |
          set -e
          cd engine-source
          mkdir -p mods
          mkdir -p assets
          # Inject the uploaded mod files into the target directories
          if [ -d "../mods_upload" ] && [ "$(ls -A ../mods_upload)" ]; then
            cp -rn ../mods_upload/* mods/ || true
            cp -rn ../mods_upload/* assets/ || true
            echo "Mods injected successfully"
          else
            echo "Warning: No mods found in mods_upload directory"
          fi

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Haxelibs and Dependencies
        run: |
          set -e
          cd engine-source
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
          if [ -f "../hmm.json" ]; then
            cp ../hmm.json ./
            haxelib run hmm install --quiet
          fi
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          echo "All Haxelibs installed successfully"

      - name: Patch HTML5 incompatible code (Mock Sys)
        run: |
          set -e
          cd engine-source
          
          # Create mock system classes for HTML5 compatibility
          mkdir -p source/hxdiscord_rpc
          
          cat > source/FileSystem.hx << 'EOF'
          class FileSystem {
            public static function absolutePath(path:String) return path;
            public static function exists(path:String) return false;
            public static function readDirectory(path:String) return [];
            public static function createDirectory(path:String) {}
            public static function deleteFile(path:String) {}
            public static function deleteDirectory(path:String) {}
            public static function rename(path:String, newpath:String) {}
            public static function stat(path:String) return null;
            public static function fullPath(relPath:String) return relPath;
          }
          EOF
          
          cat > source/File.hx << 'EOF'
          class File {
            public static function getContent(path:String) return "";
            public static function getBytes(path:String) return null;
            public static function saveContent(path:String, content:String) {}
            public static function saveBytes(path:String, bytes:Dynamic) {}
            public static function append(path:String, content:String) {}
          }
          EOF
          
          cat > source/Sys.hx << 'EOF'
          class Sys {
            public static function exit(code:Int) {}
            public static function sleep(t:Float) {}
            public static function command(cmd:String, ?args:Array<String>) return 0;
            public static function environment() return new Map<String, String>();
            public static function getEnv(name:String) return null;
            public static function putEnv(name:String, value:String) {}
            public static var print_redirect:Dynamic = null;
          }
          EOF
          
          cat > source/Process.hx << 'EOF'
          class Process {
            public var stdout:Dynamic;
            public var stderr:Dynamic;
            
            public function new(cmd:String, ?args:Dynamic) {
              stdout = { readAll: function() return { toString: function() return ""; }; };
              stderr = { readAll: function() return { toString: function() return ""; }; };
            }
            
            public function exitCode() return 0;
            public function close() {}
          }
          EOF
          
          cat > source/Thread.hx << 'EOF'
          class Thread {
            public static function create(f:Void->Void) {
              f();
              return null;
            }
            public static function readMessage(b:Bool) return null;
            public static function sendMessage(m:Dynamic) {}
          }
          EOF
          
          cat > source/Mutex.hx << 'EOF'
          class Mutex {
            public function new() {}
            public function acquire() {}
            public function release() {}
          }
          EOF
          
          cat > source/hxdiscord_rpc/Discord.hx << 'EOF'
          package hxdiscord_rpc;
          class Discord {
            public static function Initialize(a:String, b:Bool, c:Dynamic) {}
            public static function Shutdown() {}
            public static function RunCallbacks() {}
            public static function UpdatePresence(presence:Dynamic) {}
            public static function ClearPresence() {}
          }
          EOF
          
          cat > source/hxdiscord_rpc/Types.hx << 'EOF'
          package hxdiscord_rpc;
          class Types {
            public static inline var DISCORD_REPLY_NO = 0;
            public static inline var DISCORD_REPLY_YES = 1;
            public static inline var DISCORD_REPLY_IGNORE = 2;
          }
          EOF
          
          cat > source/hxdiscord_rpc/DiscordPresence.hx << 'EOF'
          package hxdiscord_rpc;
          typedef DiscordPresence = Dynamic;
          EOF
          
          # Remove incompatible dependencies from Project.xml
          if [ -f "Project.xml" ]; then
            sed -i -e '/discord_rpc/d' -e '/discord-rpc/d' -e '/linc_luajit/d' Project.xml || true
          fi
          
          # Replace sys calls with mock versions
          find source -name "*.hx" -type f -exec sed -i \
            -e 's/sys\.FileSystem/FileSystem/g' \
            -e 's/sys\.io\.File/File/g' \
            -e 's/sys\.Sys/Sys/g' \
            -e 's/sys\.Thread/Thread/g' \
            -e 's/sys\.thread\.Mutex/Mutex/g' \
            {} + || true
          
          # Fix FlxSoundTray if it exists
          if [ -f "source/flixel/ui/FlxSoundTray.hx" ]; then
            sed -i 's/public function new(/public function showIncrement() { show(); } public function showDecrement() { show(); }\n\n&/g' source/flixel/ui/FlxSoundTray.hx || true
          fi
          
          echo "HTML5 patching completed"

      - name: Optimization & Web Compile Build
        run: |
          set -e
          cd engine-source
          # Adds flags to make HTML5 compile lightweight
          echo "Building Haxe project for HTML5..."
          haxelib run lime build html5 -release -D DISCORD_DISABLE -D NO_PRELOAD_ALL -D NO_COMPILATION_TRACE
          echo "Build completed successfully"

      - name: Package Flat ZIP & Standardize output
        run: |
          set -e
          BUILD_DIR="engine-source/export/release/html5/bin"
          
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory not found at $BUILD_DIR"
            exit 1
          fi
          
          cd "$BUILD_DIR"
          
          # Rename main engine JS file to funkin.js for easier CDN embedding
          MAIN_JS=$(ls *.js 2>/dev/null | grep -E -v 'howler|pako' | head -n 1)
          if [ -n "$MAIN_JS" ] && [ "$MAIN_JS" != "funkin.js" ]; then
            echo "Renaming $MAIN_JS to funkin.js"
            mv "$MAIN_JS" funkin.js
            # Update index.html to use the new JS filename
            if [ -f "index.html" ]; then
              sed -i "s/$MAIN_JS/funkin.js/g" index.html
            fi
          fi
          
          # Ensure index.html exists with fallback
          if [ ! -f "index.html" ]; then
            echo "Creating fallback index.html"
            cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8">
              <title>Friday Night Funkin - Web Build</title>
              <style>
                body { margin: 0; padding: 0; overflow: hidden; background: #000; }
              </style>
            </head>
            <body>
              <script src="funkin.js"></script>
            </body>
          </html>
          HTMLEOF
          fi
          
          # Create ZIP archive
          echo "Creating ZIP archive..."
          zip -r ../../../../../web_export.zip . || { echo "Failed to create ZIP"; exit 1; }
          echo "ZIP archive created successfully"

      - name: Upload Web Export
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: web_export.zip
          if-no-files-found: error

      - name: Auto-Publish to GitHub Branch
        run: |
          set -e
          BUILD_DIR="engine-source/export/release/html5/bin"
          
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory not found"
            exit 1
          fi
          
          cd "$BUILD_DIR"
          
          # Initialize git repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add all files
          git add .
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated Web Port Build - $(date +'%Y-%m-%d %H:%M:%S')"
            git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:web-build
            echo "Published to web-build branch successfully"
          fi

      - name: Job Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: web-export.zip" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Branch**: web-build" >> $GITHUB_STEP_SUMMARY
          fi
