name: Build FNF Web Port

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct URL to your mod .zip file'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Base Engine
        uses: actions/checkout@v4
        with:
          repository: 'ShadowMario/FNF-PsychEngine'
          path: 'engine-source'

      - name: Download Mod Payload
        run: |
          set -e
          pip install gdown --quiet
          URL="${{ github.event.inputs.mod_url }}"
          if [[ "$URL" == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod-payload.zip || exit 1
          else
            wget -q -O mod-payload.zip "$URL" || exit 1
          fi
          mkdir -p mods_upload
          unzip -q mod-payload.zip -d mods_upload/ || exit 1
          rm mod-payload.zip

      - name: Inject Mods into Engine
        run: |
          set -e
          cd engine-source
          mkdir -p mods assets
          if [ -d "../mods_upload" ]; then
            cp -rn ../mods_upload/* mods/ || true
            cp -rn ../mods_upload/* assets/ || true
          fi

      - name: Install Linux Font Tools
        run: sudo apt-get install fontforge -y

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Install Haxelibs and Dependencies
        run: |
          set -e
          cd engine-source
          haxelib setup ~/haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install flxanimate --quiet

      - name: Patch HTML5 incompatible code & Fix Fonts
        run: |
          set -e
          cd engine-source
          
          # 1. Convert TTF to WOFF for web compatibility
          find assets/fonts -name "*.ttf" -exec sh -c 'fontforge -lang=ff -c "Open(\$1); Generate(\${1%.ttf}.woff); Close();" "$1"' _ {} \; || true

          # 2. Create Mocks with unique names to avoid browser/std collisions
          cat > source/CoolFileSystem.hx << 'EOF'
          class CoolFileSystem { 
            public static function absolutePath(p:String) return p; 
            public static function exists(p:String) return false; 
            public static function readDirectory(p:String):Array<String> return []; 
            public static function createDirectory(p:String) {} 
            public static function deleteFile(p:String) {} 
            public static function deleteDirectory(p:String) {} 
            public static function rename(p:String, n:String) {} 
            public static function stat(p:String) return null; 
            public static function fullPath(r:String) return r; 
          }
          EOF
          
          cat > source/CoolFile.hx << 'EOF'
          class CoolFile { 
            public static function getContent(p:String):String return ""; 
            public static function getBytes(p:String):Dynamic return null; 
            public static function saveContent(p:String, c:String) {} 
            public static function saveBytes(p:String, b:Dynamic) {} 
            public static function append(p:String, c:String) {} 
          }
          EOF
          
          cat > source/CoolSys.hx << 'EOF'
          class CoolSys { 
            public static function exit(c:Int) {} 
            public static function sleep(t:Float) {} 
            public static function command(c:String, ?a:Array<String>) return 0; 
            public static function environment() return new Map<String, String>(); 
            public static function getEnv(n:String) return null; 
            public static function putEnv(n:String, v:String) {} 
            public static var print_redirect:Dynamic = null; 
            public static function getCPUThreadsCount():Int return 1; 
          }
          EOF

          cat > source/FixedThreadPool.hx << 'EOF'
          class FixedThreadPool { 
            public function new(threads:Int) {} 
            public function run(f:Void->Void) { f(); } 
            public function exit() {} 
            public function shutdown() {} 
          }
          EOF

          mkdir -p source/hxdiscord_rpc
          cat > source/hxdiscord_rpc/Types.hx << 'EOF'
          package hxdiscord_rpc;
          class Types { }
          EOF
          
          # 3. Comprehensive Redefinition (Wipe out Discord/Threaded logic)
          rm -f source/backend/Discord.hx
          mkdir -p source/backend
          cat > source/backend/Discord.hx << 'EOF'
          package backend;
          class DiscordClient {
            public static function check() {}
            public static function prepare() {}
            public static function shutdown() {}
            public static function changePresence(d:String, s:String, ?i:String, ?b:Bool, ?e:Float) {}
          }
          EOF

          # 4. Patch Engine Source
          if [ -f "Project.xml" ]; then
            sed -i -e '/discord_rpc/d' -e '/discord-rpc/d' -e '/linc_luajit/d' Project.xml || true
          fi
          
          find source -name "*.hx" -type f -exec sed -i \
            -e 's/sys\.FileSystem/CoolFileSystem/g' \
            -e 's/FileSystem/CoolFileSystem/g' \
            -e 's/sys\.io\.File/CoolFile/g' \
            -e 's/File\.getContent/CoolFile.getContent/g' \
            -e 's/sys\.Sys/CoolSys/g' \
            -e 's/Sys\.getCPUThreadsCount/CoolSys.getCPUThreadsCount/g' \
            -e 's/getCPUThreadsCount()/1/g' \
            -e 's/sys\.thread\.FixedThreadPool/FixedThreadPool/g' \
            -e 's/sys\.thread\.Thread/Dynamic/g' \
            -e 's/sys\.thread\.Mutex/Dynamic/g' \
            -e 's/import sys\.thread\..*;//g' \
            -e 's/cpp\.RawConstPointer\.addressOf/cast/g' \
            -e 's/cpp\.RawPointer\.addressOf/cast/g' \
            -e 's/cpp\.RawPointer/Dynamic/g' \
            {} + || true
          
          echo "HTML5 patching completed"

      - name: Optimization & Web Compile Build
        run: |
          set -e
          cd engine-source
          haxelib run lime build html5 -release -D DISCORD_DISABLE -D NO_PRELOAD_ALL 2> build_log.txt || {
            cat build_log.txt
            if grep -q "ERROR" build_log.txt; then exit 1; fi
          }

      - name: Package Flat ZIP
        run: |
          set -e
          BUILD_DIR="engine-source/export/release/html5/bin"
          cd "$BUILD_DIR"
          MAIN_JS=$(ls *.js | grep -v 'howler' | head -n 1)
          mv "$MAIN_JS" funkin.js && sed -i "s/$MAIN_JS/funkin.js/g" index.html || true
          zip -r ../../../../../web_export.zip .

      - name: Upload & Publish
        run: |
          set -e
          BUILD_DIR="engine-source/export/release/html5/bin"
          cd "$BUILD_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Web Build Port"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:web-build
