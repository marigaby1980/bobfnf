name: Build FNF Mod from URL
on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct Download Link (Google Drive, Mediafire, etc.)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxe Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib run lime setup
          haxelib install flixel-addons flixel-ui hscript flxanimate
          haxelib git linc_luajit https://github.com/nebulaz0r/linc_luajit

      - name: Download Mod Assets
        run: |
          # Install gdown for better Google Drive handling
          pip install gdown
          
          URL="${{ github.event.inputs.mod_url }}"
          
          if [[ $URL == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod.zip
          elif [[ $URL == *"mediafire.com"* ]]; then
            # Mediafire needs a specific tool or a direct-download link
            pip install mediafire-dl
            mediafire-dl "$URL" -o mod.zip
          else
            # Standard direct link
            curl -L "$URL" -o mod.zip
          fi

      - name: Extract Mod
        run: |
          unzip -o mod.zip -d .
          # Ensure assets are in the correct place for Psych Engine
          if [ -d "assets" ]; then echo "Assets found"; fi

      - name: Compile to HTML5
        run: haxelib run lime build html5 -release

      - name: Create Single HTML File
        run: |
          npm install -g inline-assets
          cd export/release/html5/bin/
          inline-assets index.html single-file-mod.html

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod-html
          path: export/release/html5/bin/single-file-mod.html
