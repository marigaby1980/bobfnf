            public static function getEnv(name:String) return null;
            [span_27](start_span)public static function putEnv(name:String, value:String) {}[span_27](end_span)
          }
          EOF

          cat > source/FixedThreadPool.hx << 'EOF'
          class FixedThreadPool {
            public function new(threads:Int) {}
            public function run(f:Void->Void) { f(); }
            public function exit() {}
