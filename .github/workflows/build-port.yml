          }
          EOF
          
          [span_30](start_span)cat > source/hxdiscord_rpc/Discord.hx << 'EOF'[span_30](end_span)
          package hxdiscord_rpc;
          class Discord {
            public static function Initialize(a:String, b:Bool, c:Dynamic) {}
