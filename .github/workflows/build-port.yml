          cd engine-source
          mkdir -p mods assets
          [span_12](start_span)if [ -d "../mods_upload" ] && [ "$(ls -A ../mods_upload)" ]; then[span_12](end_span)
            [span_13](start_span)cp -rn ../mods_upload/* mods/ || true[span_13](end_span)
            [span_14](start_span)cp -rn ../mods_upload/* assets/ || true[span_14](end_span)
          fi

      - name: Install Linux Font Tools
