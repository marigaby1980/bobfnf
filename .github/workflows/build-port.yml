name: Build FNF Web Port

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct URL to your mod .zip file (Google Drive, Dropbox, MediaFire, Discord, etc.)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Base Engine
        uses: actions/checkout@v4
        with:
          repository: 'ShadowMario/FNF-PsychEngine'
          path: 'engine-source'

      - name: Download Mod Payload
        run: |
          echo "Downloading mod from URL provided..."
          pip install gdown --quiet
          
          URL="${{ github.event.inputs.mod_url }}"
          
          if [[ "$URL" == *"drive.google.com"* ]]; then
            ID=$(echo $URL | sed -r 's/.*(\/d\/|id=)([a-zA-Z0-9_-]+).*/\2/')
            gdown --id "$ID" -O mod-payload.zip || wget -q -O mod-payload.zip "$URL"
          else
            curl -L -A "Mozilla/5.0" "$URL" -o mod-payload.zip || wget -q -L "$URL" -O mod-payload.zip
          fi
          
          if ! unzip -t mod-payload.zip > /dev/null 2>&1; then
            echo "ERROR: The downloaded file is not a valid ZIP."
            exit 1
          fi

          echo "Extracting Mod Payload..."
          mkdir -p mods_upload
          unzip -q mod-payload.zip -d mods_upload/
          rm mod-payload.zip

      - name: Inject Mods into Engine
        run: |
          cd engine-source
          mkdir -p mods
          cp -rn ../mods_upload/* mods/ || true
          cp -rn ../mods_upload/* assets/ || true

      - name: Setup Haxe and System Tools
        run: |
          sudo apt-get update
          # Using woff-tools instead of ttf2woff
          sudo apt-get install fontforge woff-tools -y --no-install-recommends
      
      - name: Install Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Haxelibs and Dependencies
        run: |
          cd engine-source
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
          haxelib run hmm setup
          
          if [ -f "hmm.json" ]; then
            haxelib run hmm install --quiet || echo "hmm install failed, continuing manually..."
          fi

          haxelib install lime 8.1.1 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install flixel-ui 2.6.1 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install flxanimate 3.0.4 --quiet
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit --quiet
          
          haxelib run lime setup

      - name: Patch HTML5 incompatible code (Surgical Logic)
        run: |
          cd engine-source
          
          # 1. Safe Neutralization of Discord.hx
          DISCORD_FILE=$(find source -name "Discord.hx")
          if [ -f "$DISCORD_FILE" ]; then
            PACKAGE_NAME=$(grep "package" "$DISCORD_FILE" | head -n 1)
            echo "$PACKAGE_NAME" > "$DISCORD_FILE"
            echo "class DiscordClient { public static function check() {} public static function prepare() {} public static function shutdown() {} public static function changePresence(details:String, state:String, ?smallImageKey:String, ?hasStartTimestamp:Bool, ?endTimestamp:Float) {} public static function initialize() {} public static function addLuaCallbacks(lua:Dynamic) {} }" >> "$DISCORD_FILE"
            echo "class Discord { public static function addLuaCallbacks(lua:Dynamic) {} public static function changePresence(details:String, state:String, ?smallImageKey:String, ?hasStartTimestamp:Bool, ?endTimestamp:Float) {} public static function initialize() {} }" >> "$DISCORD_FILE"
          fi

          # 2. Mock Sys/File/Thread classes
          echo 'class FileSystem { public static function absolutePath(path:String) return path; public static function exists(path:String) return false; public static function readDirectory(path:String):Array<String> return []; public static function isDirectory(path:String) return false; public static function stat(path:String) return null; public static function fullPath(path:String) return path; public static function createDirectory(path:String) {} public static function deleteFile(path:String) {} public static function deleteDirectory(path:String) {} }' > source/FileSystem.hx
          echo 'class File { public static function getContent(path:String) return ""; public static function getBytes(path:String) return null; public static function saveContent(path:String, c:String) return; public static function saveBytes(path:String, b:Dynamic) return; public static function copy(s:String, d:String) {} }' > source/File.hx
          echo 'class Sys { public static function exit(code:Int) {} public static function sleep(t:Float) {} public static function command(c:String, ?a:Array<String>) return 0; public static function args():Array<String> return []; public static function getCwd() return ""; public static function setCwd(s:String) {} public static function print(v:Dynamic) {} public static function println(v:Dynamic) {} public static function environment() return new haxe.ds.StringMap<String>(); public static function getEnv(s:String) return ""; public static function programPath() return ""; }' > source/Sys.hx
          echo 'class Thread { public static function create(f:Void->Void) { f(); } public static function readMessage(b:Bool) return null; public static function sendMessage(m:Dynamic) {} }' > source/Thread.hx

          # 3. Handle Project.xml dependencies
          sed -i -e '/discord_rpc/d' -e '/discord-rpc/d' -e '/linc_luajit/d' Project.xml || true

          # 4. Global Surgical Replacement (Avoids mangling structure)
          # We use a more specific pattern to avoid the 'Expected }' error
          find source -name "*.hx" -type f -exec sed -i \
            -e 's/sys\.FileSystem/FileSystem/g' \
            -e 's/sys\.io\.File/File/g' \
            -e 's/sys\.thread\.Thread/Thread/g' \
            -e 's/DiscordRichPresence/Dynamic/g' \
            -e 's/DiscordPresence/Dynamic/g' \
            -e 's/cpp\.RawConstPointer/Dynamic/g' \
            -e 's/cpp\.RawPointer/Dynamic/g' \
            -e 's/cpp\.Lib/Dynamic/g' \
            -e 's/import cpp\./\/\/ import cpp./g' \
            -e 's/import llua\./\/\/ import llua./g' {} +

      - name: Optimization & Web Compile Build
        run: |
          cd engine-source
          haxelib run lime build html5 -release -D DISCORD_DISABLE -D NO_PRELOAD_ALL

      - name: Package Flat ZIP & Standardize output
        run: |
          cd engine-source/export/release/html5/bin
          MAIN_JS=$(ls *.js | grep -E -v 'howler|pako' | head -n 1)
          if [ -n "$MAIN_JS" ] && [ "$MAIN_JS" != "funkin.js" ]; then
            mv "$MAIN_JS" funkin.js
            if [ -f "index.html" ]; then
              sed -i "s/$MAIN_JS/funkin.js/g" index.html
            fi
          fi
          
          if [ ! -f "index.html" ]; then
            echo "<!DOCTYPE html><html><body style='background-color: black;'><script src='funkin.js'></script></body></html>" > index.html
          fi
          
          zip -r ../../../../../web_export.zip *

      - name: Upload Web Export
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: web_export.zip

      - name: Auto-Publish to GitHub Branch
        run: |
          cd engine-source/export/release/html5/bin
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated Web Port Build"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:web-build
