          fi
          mkdir -p mods_upload
          unzip -q mod-payload.zip -d mods_upload/ || { echo "Failed to extract ZIP"; exit 1; [span_10](start_span)}
          rm mod-payload.zip

      - name: Inject Mods into Engine[span_10](end_span)
        run: |
