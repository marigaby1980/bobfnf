name: Psych Engine HTML5 Compiler
on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct Link to Mod Zip (Google Drive, Mediafire, or Direct)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxe Libraries
        run: |
          haxelib setup ~/haxelib
          # Core Framework
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib run lime setup
          
          # UI and Scripting (Required for custom mechanics)
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install flxanimate
          
          # Psych Engine Specifics (Lua and Video support)
          haxelib git linc_luajit https://github.com/nebulaz0r/linc_luajit
          haxelib git hxvlc https://github.com/MAJESTY-Development/hxvlc
          haxelib git faxe https://github.com/uhyolive/faxe
          haxelib git polymod https://github.com/mastereric/polymod

      - name: Download Mod Assets
        run: |
          # Install downloaders
          pip install gdown mediafire-dl
          
          URL="${{ github.event.inputs.mod_url }}"
          
          if [[ $URL == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod.zip
          elif [[ $URL == *"mediafire.com"* ]]; then
            mediafire-dl "$URL" -o mod.zip
          else
            curl -L "$URL" -o mod.zip
          fi

      - name: Extract Mod Zip
        run: |
          # Extracts the zip into the project root
          unzip -o mod.zip -d .
          # Standard Psych Engine builds look for an 'assets' folder
          if [ ! -d "assets" ]; then
            echo "Warning: No assets folder found in zip root!"
          fi

      - name: Compile to HTML5
        run: |
          # Clean build to prevent cache errors
          haxelib run lime clean html5
          haxelib run lime build html5 -release

      - name: Convert to Single HTML File
        run: |
          # Installs the bundler and creates a standalone file
          npm install -g inline-assets
          cd export/release/html5/bin/
          inline-assets index.html single-file-mod.html

      - name: Upload Final Build
        uses: actions/upload-artifact@v4
        with:
          name: Psych-Engine-Single-File
          path: export/release/html5/bin/single-file-mod.html
