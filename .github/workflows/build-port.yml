name: Build FNF Web Port

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct URL to your mod .zip file (Google Drive, Dropbox, MediaFire, Discord, etc.)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (this repo)
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip zip git wget curl python3-pip

      - name: Clone Base Engine (ShadowMario/FNF-PsychEngine)
        run: |
          set -e
          # clone shallowly to engine-source
          rm -rf engine-source
          git clone --depth=1 https://github.com/ShadowMario/FNF-PsychEngine.git engine-source

      - name: Download Mod Payload
        run: |
          set -e
          echo "Downloading mod from URL provided..."
          pip3 install --upgrade gdown --quiet

          URL="${{ github.event.inputs.mod_url }}"
          echo "URL: $URL"

          # Use gdown --fuzzy for Google Drive share links, fallback to wget
          if [[ "$URL" == *"drive.google.com"* ]]; then
            # gdown --fuzzy accepts many share formats
            gdown --fuzzy "$URL" -O mod-payload.zip
          else
            # attempt direct download with curl, fallback to wget
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL -o mod-payload.zip "$URL" || wget -q -O mod-payload.zip "$URL"
            else
              wget -q -O mod-payload.zip "$URL"
            fi
          fi

          if [ ! -f mod-payload.zip ]; then
            echo "Failed to download mod payload from $URL"
            exit 2
          fi

          echo "Extracting Mod Payload..."
          rm -rf mods_upload
          mkdir -p mods_upload
          unzip -q mod-payload.zip -d mods_upload/ || (echo "unzip failed — listing archive:" && unzip -l mod-payload.zip && exit 3)
          rm mod-payload.zip

      - name: Inject Mods into Engine
        run: |
          set -e
          cd engine-source
          mkdir -p mods
          # Copy uploaded mod files into engine's mods and assets directories (no overwrite existing files)
          cp -rn ../mods_upload/* mods/ || true
          cp -rn ../mods_upload/* assets/ || true

      - name: Setup Haxe (attempt via action)
        # If this action doesn't match your needs on the runner, replace this step with your preferred Haxe install.
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Haxelibs and Dependencies
        run: |
          set -e
          cd engine-source
          # Ensure haxelib directory exists
          haxelib setup ~/haxelib || true
          haxelib install hmm --quiet || true
          haxelib run hmm install --quiet || true
          haxelib install lime || true
          haxelib install openfl || true
          haxelib install flixel || true

      - name: Patch HTML5 incompatible code (Mock Sys)
        run: |
          set -e
          cd engine-source

          # Create a safe 'source' dir if missing
          mkdir -p source

          # Write small mocks using heredoc to avoid quoting problems
          cat > source/FileSystem.hx <<'EOF'
          class FileSystem {
            public static function absolutePath(path:String) return path;
            public static function exists(path:String) return false;
            public static function readDirectory(path:String) return [];
          }

          cat > source/File.hx <<'EOF'
          class File {
            public static function getContent(path:String) return "";
            public static function getBytes(path:String) return null;
            public static function saveContent(path:String, c:String) {}
          }
EOF

          cat > source/Sys.hx <<'EOF'
          class Sys {
            public static function exit(code:Int) {}
            public static function sleep(t:Float) {}
            public static function command(c:String, ?a:Array<String>) return 0;
          }
EOF

          cat > source/Process.hx <<'EOF'
          class Process {
            public var stdout:Dynamic;
            public var stderr:Dynamic;
            public function new(c:String, ?a:Dynamic) {
              stdout = { readAll: function() return { toString: function() return "" } };
              stderr = stdout;
            }
          }
EOF

          cat > source/Mutex.hx <<'EOF'
          class Mutex {
            public function new() {}
            public function acquire() {}
            public function release() {}
          }
EOF

          # Remove known optional dependencies that commonly break HTML5 builds
          sed -i -e '/discord_rpc/d' -e '/discord-rpc/d' -e '/linc_luajit/d' Project.xml || true

          # Provide small stub package for hxdiscord_rpc if engine expects it
          mkdir -p source/hxdiscord_rpc
          cat > source/hxdiscord_rpc/Discord.hx <<'EOF'
          package hxdiscord_rpc;
          class Discord {
            public static function Initialize(a:String,b:Bool,c:Dynamic) {}
            public static function Shutdown() {}
            public static function RunCallbacks() {}
          }
EOF
          cat > source/hxdiscord_rpc/DiscordPresence.hx <<'EOF'
          package hxdiscord_rpc;
          typedef DiscordPresence = Dynamic;
EOF
          cat > source/hxdiscord_rpc/Types.hx <<'EOF'
          package hxdiscord_rpc;
          class Types {
            public static inline var DISCORD_REPLY_NO = 0;
            public static inline var DISCORD_REPLY_YES = 1;
            public static inline var DISCORD_REPLY_IGNORE = 2;
          }
EOF

          # Replace some problematic sys class usages (safe, limited scope)
          # NOTE: these sed rules are conservative; adjust if you know more specific replacements are needed.
          find source -name "*.hx" -type f -exec sed -i -e 's/sys\.FileSystem/FileSystem/g' -e 's/sys\.io\.File/File/g' {} + || true

      - name: Optimization & Web Compile Build
        run: |
          set -e
          cd engine-source
          # Build for HTML5 (may take several minutes; ensure haxe/lime/openfl are installed and working)
          haxelib run lime build html5 -release -D DISCORD_DISABLE -D NO_PRELOAD_ALL

      - name: Package Flat ZIP & Standardize output
        run: |
          set -e
          cd engine-source/export/release/html5/bin

          # Find main JS (avoid known libs)
          MAIN_JS=$(ls *.js 2>/dev/null | grep -E -v 'howler|pako' | head -n 1 || true)
          if [ -n "$MAIN_JS" ] && [ "$MAIN_JS" != "funkin.js" ]; then
            mv "$MAIN_JS" funkin.js || true
            # Update index.html to use the new JS filename if index.html exists
            if [ -f "index.html" ]; then
              sed -i "s/${MAIN_JS}/funkin.js/g" index.html || true
            fi
          fi

          # Ensure index.html exists as a fallback
          if [ ! -f "index.html" ]; then
            cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
            <body><h1>FNF Web Build</h1><script src="funkin.js"></script></body>
          </html>
EOF
          fi

          # Zip the produced artifacts
          zip -r ../../../../../web_export.zip * || (echo "zip failed — check files in bin/"; exit 1)

      - name: Upload Web Export
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: web_export.zip

      - name: Auto-Publish to GitHub Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd engine-source/export/release/html5/bin
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated Web Port Build" || true
          # Push back to this repository on branch web-build
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:web-build
