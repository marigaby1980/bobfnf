      - [span_6](start_span)name: Download Mod Payload[span_6](end_span)
        run: |
          [span_7](start_span)set -e[span_7](end_span)
          pip install gdown --quiet
          URL="${{ github.event.inputs.mod_url }}"
          [span_8](start_span)if [[ "$URL" == *"drive.google.com"* ]]; then[span_8](end_span)
            gdown "$URL" -O mod-payload.zip || { echo "Failed to download from Drive"; exit 1; [span_9](start_span)}
