name: Build FNF Web Port
on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct URL to mod .zip'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Base Engine
        uses: actions/checkout@v4
        with:
          repository: 'ShadowMario/FNF-PsychEngine'
          path: 'engine-source'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5 # Stick to 4.2.5 for Psych Engine stability

      - name: Install Haxelibs (Individually)
        run: |
          haxelib setup ~/haxelib
          # Install core one by one to avoid dependency conflicts
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib run lime setup
          haxelib install flixel-addons 3.2.1 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install tjson --quiet
          haxelib install flxanimate --quiet
          
          # Use the ZIP method for Lua to bypass the cloning errors seen in your logs
          curl -sL https://github.com/nebulaz0r/linc_luajit/archive/refs/heads/master.zip -o lua.zip
          haxelib install lua.zip --quiet
          echo "✅ Libraries finished."

      - name: Download & Inject Mod
        run: |
          pip install -q gdown
          URL="${{ github.event.inputs.mod_url }}"
          if [[ "$URL" == *"drive.google.com"* ]]; then
            gdown -q "$URL" -O mod.zip
          else
            curl -sL "$URL" -o mod.zip
          fi
          mkdir -p mod_extract
          unzip -qq -o mod.zip -d mod_extract/
          cp -rn mod_extract/* engine-source/mods/ || true
          cp -rn mod_extract/* engine-source/assets/ || true

      - name: Patch for Web Compatibility
        run: |
          cd engine-source
          # Remove Discord from Project.xml but KEEP linc_luajit
          sed -i '/discord-rpc/d' Project.xml || true
          sed -i '/hxdiscord_rpc/d' Project.xml || true
          
          # Create Mocks to prevent desktop-only crashes
          mkdir -p source/hxdiscord_rpc
          echo "class FileSystem { public static function exists(p:String) return false; public static function readDirectory(p:String) return []; public static function absolutePath(p:String) return p; }" > source/FileSystem.hx
          echo "class Sys { public static function exit(c:Int) {} public static function sleep(t:Float) {} public static function args() return []; }" > source/Sys.hx
          echo "package hxdiscord_rpc; class Discord { public static function Initialize(a:String, b:Bool, c:Dynamic) {} public static function Shutdown() {} }" > source/hxdiscord_rpc/Discord.hx

          # Force the engine to use our mock classes instead of system ones
          find source -name "*.hx" -type f -exec sed -i -e 's/sys\.FileSystem/FileSystem/g' -e 's/sys\.Sys/Sys/g' {} +

      - name: Build Web Target
        run: |
          cd engine-source
          haxelib run lime build html5 -release -D DISCORD_DISABLE

      - name: Standardize and Publish
        run: |
          cd engine-source/export/release/html5/bin
          # Clean up the JS filename for the web branch
          MAIN_JS=$(ls *.js | grep -v 'howler' | head -n 1)
          mv "$MAIN_JS" funkin.js
          sed -i "s/$MAIN_JS/funkin.js/g" index.html
          
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Web Build $(date)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:web-build

      - name: Generate Standalone Artifact
        run: |
          npm install -g inline-assets --silent
          cd engine-source/export/release/html5/bin
          inline-assets index.html ../../../../index.html > /dev/null

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Web-Mod
          path: index.html
