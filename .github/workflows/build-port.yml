name: Psych Engine HTML5 Compiler (Silent)
on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct Link to Mod Zip'
        required: true
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install System Dependencies (Silent)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libvlc-dev libvlccore-dev -y > /dev/null

           - name: Install Haxe Libraries (Silent)
        run: |
          haxelib setup ~/haxelib
          
          # Core Framework
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib run lime setup --quiet
          
          # UI and Scripting
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install flxanimate --quiet
          
          # THE FIX: Download linc_luajit as a ZIP and install locally, bypassing git clone
          curl -sL https://github.com/nebulaz0r/linc_luajit/archive/refs/heads/master.zip -o linc_luajit.zip
          haxelib local linc_luajit.zip --quiet
          
          # Install the remaining git libraries (These usually clone without issue)
          haxelib git hxvlc https://github.com/MAJESTY-Development/hxvlc master --force --quiet
          haxelib git faxe https://github.com/uhyolive/faxe master --force --quiet
          haxelib git polymod https://github.com/mastereric/polymod master --force --quiet
          
          echo "✅ All Haxe libraries installed."

      - name: Download Mod Assets (Silent)
        run: |
          pip install -q gdown mediafire-dl
          
          URL="${{ github.event.inputs.mod_url }}"
          
          if [[ $URL == *"drive.google.com"* ]]; then
            gdown -q "$URL" -O mod.zip
          elif [[ $URL == *"mediafire.com"* ]]; then
            mediafire-dl "$URL" -o mod.zip > /dev/null
          else
            curl -sL "$URL" -o mod.zip
          fi
          echo "✅ Mod downloaded."

      - name: Extract Mod Zip
        run: |
          unzip -qq -o mod.zip -d .
          echo "✅ Assets extracted."

      - name: Compile to HTML5
        run: |
          haxelib run lime clean html5 -quiet
          haxelib run lime build html5 -release -quiet

      - name: Convert to Single HTML File (Silent)
        run: |
          npm install -g inline-assets --silent
          cd export/release/html5/bin/
          inline-assets index.html single-file-mod.html > /dev/null
          echo "✅ Single-file HTML generated."

      - name: Upload Final Build
        uses: actions/upload-artifact@v4
        with:
          name: Psych-Engine-Single-File
          path: export/release/html5/bin/single-file-mod.html
