          haxelib install hmm --quiet
          [span_17](start_span)if [ -f "../hmm.json" ]; then[span_17](end_span)
            cp ../hmm.json ./
            haxelib run hmm install --quiet
          fi
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install flxanimate --quiet
          haxelib install hscript --quiet
          echo "All Haxelibs installed successfully"

      - [span_18](start_span)name: Patch HTML5 incompatible code (Mock Sys)[span_18](end_span)
        run: |
          [span_19](start_span)set -e[span_19](end_span)
