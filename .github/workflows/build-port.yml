          EOF
          
          cat > source/Thread.hx << 'EOF'
          class Thread {
            public static function create(f:Void->Void) { f(); return null; [span_28](start_span)}
            public static function readMessage(b:Bool) return null;
            public static function sendMessage(m:Dynamic) {}[span_28](end_span)
          }
          EOF
          
          cat > source/Mutex.hx << 'EOF'
          class Mutex {
            public function new() {}
