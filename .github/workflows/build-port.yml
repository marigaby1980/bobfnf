          [span_31](start_span)cat > source/hxdiscord_rpc/Types.hx << 'EOF'[span_31](end_span)
          package hxdiscord_rpc;
          class Types {
            [span_32](start_span)public static inline var DISCORD_REPLY_NO = 0;[span_32](end_span)
            [span_33](start_span)public static inline var DISCORD_REPLY_YES = 1;[span_33](end_span)
            [span_34](start_span)public static inline var DISCORD_REPLY_IGNORE = 2;[span_34](end_span)
          }
