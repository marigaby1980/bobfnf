name: Psych Engine HTML5 Compiler
on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct Link to Mod Zip (Google Drive, Mediafire, or Direct)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true # Ensures submodules are pulled if present

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libvlc-dev libvlccore-dev -y

      - name: Install Haxe Libraries
        run: |
          haxelib setup ~/haxelib --silent
          # Core Framework
          haxelib install lime 8.0.1 --silent
          haxelib install openfl 9.2.1 --silent
          haxelib install flixel 5.2.2 --silent
          haxelib run lime setup --silent
          
          # UI and Scripting
          haxelib install flixel-addons --silent
          haxelib install flixel-ui --silent
          haxelib install hscript --silent
          haxelib install flxanimate --silent
          
          # Psych Engine Specifics (Using the most stable git links)
          haxelib git linc_luajit https://github.com/nebulaz0r/linc_luajit.git
          haxelib git hxvlc https://github.com/MAJESTY-Development/hxvlc.git
          haxelib git faxe https://github.com/uhyolive/faxe.git
          haxelib git polymod https://github.com/mastereric/polymod.git

      - name: Download Mod Assets
        run: |
          pip install gdown mediafire-dl
          
          URL="${{ github.event.inputs.mod_url }}"
          
          if [[ $URL == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod.zip
          elif [[ $URL == *"mediafire.com"* ]]; then
            mediafire-dl "$URL" -o mod.zip
          else
            curl -L "$URL" -o mod.zip
          fi

      - name: Extract Mod Zip
        run: |
          unzip -o mod.zip -d .
          # Check for assets folder to ensure zip structure is correct
          if [ -d "assets" ]; then
            echo "Assets directory verified."
          else
            echo "Warning: No assets folder found in root of zip."
          fi

      - name: Compile to HTML5
        run: |
          haxelib run lime clean html5
          haxelib run lime build html5 -release

      - name: Convert to Single HTML File
        run: |
          npm install -g inline-assets
          cd export/release/html5/bin/
          # This packs JS, WASM, and Assets into one HTML
          inline-assets index.html single-file-mod.html

      - name: Upload Final Build
        uses: actions/upload-artifact@v4
        with:
          name: Psych-Engine-Single-File
          path: export/release/html5/bin/single-file-mod.html
