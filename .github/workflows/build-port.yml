name: Custom Psych Engine HTML5 Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxe Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib run lime setup
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install flxanimate
          haxelib git linc_luajit https://github.com/nebulaz0r/linc_luajit
          haxelib git hxvlc https://github.com/MAJESTY-Development/hxvlc
          # Add any other custom libraries your mechanics require here

      - name: Inject Mod Zip
        run: |
          # If your zip is named 'mod.zip', this extracts it into the project structure
          unzip -o mod.zip -d . 

      - name: Compile to HTML5
        run: haxelib run lime build html5 -release

      - name: Convert to Single HTML File
        run: |
          # Use a tool to bundle JS/WASM into the HTML
          npm install -g inline-assets
          cd export/release/html5/bin/
          inline-assets index.html single-file-mod.html

      - name: Upload Single File Build
        uses: actions/upload-artifact@v4
        with:
          name: single-html-mod
          path: export/release/html5/bin/single-file-mod.html
